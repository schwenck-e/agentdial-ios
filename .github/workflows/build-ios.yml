name: Build AgentDial iOS (.IPA)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build AgentDial iOS IPA
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Check Xcode Version
        run: |
          xcodebuild -version

      - name: Resolve Swift Package Manager Dependencies
        run: |
          xcodebuild -resolvePackageDependencies -project LinphoneApp.xcodeproj -scheme LinphoneApp

      - name: Build and Archive (Unsigned for Sideloading / AltStore)
        run: |
          xcodebuild clean archive \
            -project LinphoneApp.xcodeproj \
            -scheme LinphoneApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/AgentDial.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package .IPA
        run: |
          mkdir -p build/ipa_payload/Payload
          cp -r build/AgentDial.xcarchive/Products/Applications/LinphoneApp.app build/ipa_payload/Payload/AgentDial.app
          cd build/ipa_payload
          zip -r ../AgentDial.ipa Payload
          cd ../..
          echo "✅ AgentDial.ipa criado com sucesso!"
          ls -lh build/AgentDial.ipa

      - name: Upload AgentDial IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentDial-iOS-Installer
          path: build/AgentDial.ipa
          retention-days: 14
